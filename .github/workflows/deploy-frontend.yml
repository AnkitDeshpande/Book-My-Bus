name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

# Permissions required for official GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: frontend

      - name: Build
        run: bun run build
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # Step 1: Upload the dist folder as a temporary artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Step 2: Deploy that artifact directly to the web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
