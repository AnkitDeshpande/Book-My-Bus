<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Book My Bus</title>
    <script>
      // Single-Page App redirect trick for GitHub Pages.
      // Encodes the intended path into the query string so index.html can restore it.
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') +
        '/?p=' + l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
