# ============================================================
#  Book My Bus - Application Configuration
# ============================================================

# --- Server ---
server.port=${SERVER_PORT:8888}
server.servlet.context-path=/

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookmybus?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- JWT ---
jwt.secret=${JWT_SECRET:g{8VrxgfOP@yQ;DtPzM1.uh6&#dPTRzmrg0hoRFtIPr}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Admin Seed (DataInitializer) ---
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@bookmybus.com}
app.admin.password=${ADMIN_PASSWORD:Admin@1234}
app.admin.first-name=${ADMIN_FIRST_NAME:Super}
app.admin.last-name=${ADMIN_LAST_NAME:Admin}
app.admin.phone=${ADMIN_PHONE:9999999999}

# --- SpringDoc / Swagger ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tags-sorter=alpha

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# --- Logging ---
logging.level.com.masai=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# --- Exception Handling ---
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
